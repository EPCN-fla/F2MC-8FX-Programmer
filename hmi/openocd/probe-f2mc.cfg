# F2MC-8FX/STM32 双路编程器 —— CMSIS-DAP 探针适配器配置
# 供 OpenOCD 烧录 STM32 目标使用（F2MC 目标请走 f2mc-programmer-cli/GUI，vendor 协议非 OpenOCD 所能驱动）
#
# 用法:
#   openocd -s <openocd>/share/openocd/scripts -s <本目录> -f probe-f2mc.cfg \
#           -c "init" -c "cmsis-dap info" -c "shutdown"

adapter driver cmsis-dap

# 自动连接第一台 CMSIS-DAP 设备（接口字符串识别）
# 多探针环境可用全局命令限定（需 OpenOCD ≥ 0.12 正式版）：
#   adapter vid_pid 0x0483 0x5750
#   adapter serial "<序列号>"

# SWD 传输（编程器 DAP 接口固件实现标准 CMSIS-DAP 命令 0x00~0x7F，docs/通信协议约定.md §1）
transport select swd

# SWD 时钟（kHz）：1000 = 1 MHz，长线缆/干扰环境降到 100
adapter speed 1000
