# F2MC 目标烧录配置 —— 供 f2mc-programmer-cli --openocd 模式解析（非 OpenOCD TCL！）
#
# 用法：
#   f2mc-programmer-cli --openocd -f f2mc-target.cfg -c "program app.hex verify reset exit"
#
# 把"openocd 可执行文件"指向 f2mc-programmer-cli.exe，cfg 参数指向本文件即可像烧 STM32 一样烧 F2MC。
#
# 格式：set <键> <值>（# 开头为注释，空行忽略）

# 目标芯片型号（216 款 FMC8FX 之一，影响 hex 范围校验与镜像大小）
set F2MC_CHIP MB95F636H

# 烧录后是否写安全位 0xFFFC=0x01（1=写，0=不写；写后需整片擦除才能再次烧录）
set F2MC_SECURE 0

# program 命令行带 reset 关键字时的行为（1=复位运行提示，0=保持编程模式）
# 注：编程器无复位硬件，"复位运行"实际为提示人工断电重启
set F2MC_RESET 1
