# STM32F1 系列烧录配置（经 F2MC 编程器 CMSIS-DAP）
#
# 命令行烧录示例:
#   openocd -s <openocd>/share/openocd/scripts -s <本目录> -f stm32f1x-burn.cfg \
#           -c "program app.hex verify reset exit"

source [find probe-f2mc.cfg]

# 目标：STM32F1x（C8T6 等全系共用，OpenOCD 自动识别 flash 布局）
source [find target/stm32f1x.cfg]

# 编程器无 SRST 硬件线（docs/通信协议约定.md §3.1 RESET_RUN 注记）：
# 不能用 srst，改为软件复位（SYSRESETREQ），支持无复位线烧录
reset_config none
cortex_m reset_config sysresetreq
